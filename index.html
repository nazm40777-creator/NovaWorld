<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaWorld</title>
<link rel="stylesheet" href="/static/style.css">
</head>

<body>

<header class="top-header">
  <h1>NovaWorld 🌌</h1>
  <span>Online 🟢</span>
</header>

<main>
  <section class="world">
    <div class="item">✈️ المطار الدولي</div>
    <div class="item">🚆 محطة القطار</div>
    <div class="item">🏥 مستشفى التعليم</div>
    <div class="item">🏦 البنك المركزي</div>
    <div class="item">🏙️ وسط المدينة</div>
  </section>

  <section class="chat">
    <h2>💬 المراسلة</h2>
    <div id="messages"></div>
    <input id="messageInput" placeholder="اكتب رسالة...">
    <button onclick="sendChat()">إرسال</button>
  </section>

  <section class="profile">
    <h2>👤 Player</h2>
    <p>المستوى: 1 ⭐</p>
    <p>العملات: 0 💎</p>
    <button>تعديل الملف</button>
  </section>

  <section class="bag">
    <h2>🎒 الحقيبة</h2>
    <p>🚗 سيارة</p>
    <p>🏠 منزل</p>
    <p>💎 كريستال</p>
  </section>
</main>

<nav class="bottom-nav">
  <button>🌍 العالم</button>
  <button>💬 المراسلة</button>
  <button>👤 الملف</button>
  <button>⚙️ الإعدادات</button>
</nav>

<script src="/static/game.js"></script>
</body>
</html>
