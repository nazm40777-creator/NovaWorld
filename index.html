<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NovaWorld</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div id="app">


<!-- HEADER -->

<header class="top-header">

<h1>
🌌 NovaWorld
</h1>

<div class="online">
🟢 Online
</div>

</header>





<!-- WORLD PAGE -->

<section id="home-page" class="page active">


<div id="world-map">


<div class="location airport">

✈️
<h3>
المطار الدولي
</h3>

</div>



<div class="location station">

🚆
<h3>
محطة القطار
</h3>

</div>



<div class="location hospital">

🏥
<h3>
مستشفى التعليم
</h3>

</div>



<div class="location bank">

🏦
<h3>
البنك المركزي
</h3>

</div>



<div class="location city">

🏙️
<h3>
وسط المدينة
</h3>

</div>





<!-- PLAYER -->

<div id="player">

🧍

</div>





<!-- VEHICLES -->

<div class="vehicle plane">
✈️
</div>


<div class="vehicle car">
🚗
</div>


<div class="vehicle train">
🚆
</div>



</div>


</section>





<!-- MESSAGES PAGE -->


<section id="messages-page" class="page">


<div class="panel">


<h2>
💬 المراسلة
</h2>



<div id="chat-list">


<div class="chat-user">

👤 لاعب جديد

<p>
مرحبا 👋
</p>

</div>



<div class="chat-user">

🌍 العالم

<p>
100 لاعب متصل
</p>

</div>



</div>



<div class="chat-input">


<input 
id="message"
placeholder="اكتب رسالة..."
>


<button id="send">
إرسال
</button>


</div>


</div>


</section>
<!-- PROFILE PAGE -->

<section id="profile-page" class="page">


<div class="panel profile-box">


<div class="avatar">
🧑‍🚀
</div>


<h2 id="username">
Player
</h2>



<div class="profile-stat">

⭐ المستوى:
<span id="level">
1
</span>

</div>



<div class="profile-stat">

💎 العملات:
<span id="coins">
0
</span>

</div>



<div class="profile-stat">

🏆 الرتبة:
<span>
Beginner
</span>

</div>



<button class="edit-btn">

تعديل الملف

</button>


</div>


</section>





<!-- INVENTORY PAGE -->


<section id="inventory-page" class="page">


<div class="panel">


<h2>
🎒 الحقيبة
</h2>



<div class="inventory">


<div class="item">

🚗

سيارة

</div>



<div class="item">

🏠

منزل

</div>



<div class="item">

💎

كريستال

</div>



<div class="item">

🎁

هدية

</div>


</div>



</div>


</section>





<!-- SETTINGS PAGE -->


<section id="settings-page" class="page">


<div class="panel">


<h2>
⚙️ الإعدادات
</h2>


<button>
الصوت 🔊
</button>


<button>
اللغة 🌐
</button>


<button>
تسجيل خروج 🚪
</button>


</div>


</section>
<!-- BOTTOM NAVIGATION -->

<nav class="bottom-nav">


<button data-page="home-page">

🌍

<span>
العالم
</span>

</button>



<button data-page="messages-page">

💬

<span>
المراسلة
</span>

</button>



<button data-page="profile-page">

👤

<span>
الملف
</span>

</button>



<button data-page="inventory-page">

🎒

<span>
الحقيبة
</span>

</button>



<button data-page="settings-page">

⚙️

<span>
الإعدادات
</span>

</button>



</nav>




</div>



<script src="game.js"></script>


</body>

</html>
